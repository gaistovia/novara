<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="rgba(232,245,240,0.09)" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect width="640" height="640" fill="white"/>
      <rect width="640" height="640" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="640" height="640" fill="url(#grid)" mask="url(#fadeMask)"/>
</svg>
